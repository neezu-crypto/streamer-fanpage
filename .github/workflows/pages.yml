name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/997788925900/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: fanpage-static-exporter@soop-stock-market.iam.gserviceaccount.com
          project_id: soop-stock-market
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: soop-stock-market
      - name: Get usage reporter URL
        id: usage-reporter
        run: |
          URL="$(gcloud functions describe streamerFanPageViewerStatsExportUsage --gen2 --region=us-central1 --project=soop-stock-market --format='value(serviceConfig.uri)')"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Authenticate for usage report
        id: usage-reporter-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/997788925900/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: fanpage-static-exporter@soop-stock-market.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: ${{ steps.usage-reporter.outputs.url }}
          id_token_include_email: true
          create_credentials_file: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install export dependencies
        run: npm ci --prefix functions
      - name: Export analyzed VOD summaries
        shell: bash
        run: |
          node functions/export-viewer-stats.js
        env:
          VIEWER_STATS_USAGE_REPORT_URL: ${{ steps.usage-reporter.outputs.url }}
          VIEWER_STATS_USAGE_REPORT_TOKEN: ${{ steps.usage-reporter-auth.outputs.id_token }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare Pages directory
        run: |
          mkdir -p _site
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C _site
          mkdir -p _site/static-data/viewer-stats
          cp -a static-data/viewer-stats/. _site/static-data/viewer-stats/
      - name: Guard private admin snapshots
        run: |
          if find _site -type f -path '*/admin-stats/*.json' -print -quit | grep -q .; then
            echo "Private admin stats snapshots must not be published to Pages."
            exit 1
          fi
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
