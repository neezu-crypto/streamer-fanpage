<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>주간 방송 일정표</title>
  <style>
    @font-face{font-family:Jua;src:url('assets/fonts/Jua-Regular.woff2') format('woff2');font-display:swap}
    @font-face{font-family:Gowun;src:url('assets/fonts/GowunDodum-Regular.woff2') format('woff2');font-display:swap}
    *{box-sizing:border-box}body{margin:0;background:transparent;color:#563b60;font-family:Gowun,sans-serif}#stage{position:relative;width:100%;aspect-ratio:1672/941;overflow:hidden}canvas{display:block;width:100%;height:100%}#avatar{position:absolute;left:5.622%;top:18.704%;width:23.325%;height:60.043%;object-fit:cover;border-radius:8px}#status{padding:1em;text-align:center}#stage.starlight.motion::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 35% 7%,#fff 0 2px,transparent 5px),radial-gradient(circle at 97% 30%,#fff 0 2px,transparent 5px),radial-gradient(circle at 35% 94%,#fff 0 2px,transparent 5px);animation:stars 3s ease-in-out infinite alternate}#stage.starlight.motion::before{content:'';position:absolute;z-index:1;pointer-events:none;top:4%;right:2%;width:5%;height:2px;background:linear-gradient(90deg,transparent,#fff);animation:comet 9s ease-in-out infinite}@keyframes stars{from{opacity:.2}to{opacity:.9}}@keyframes comet{0%,76%,100%{opacity:0;transform:translate(0,0) rotate(-30deg)}80%{opacity:.8}86%{opacity:0;transform:translate(-22px,12px) rotate(-30deg)}}@media(prefers-reduced-motion:reduce){#stage.starlight.motion::before,#stage.starlight.motion::after{animation:none;opacity:0}}
  </style>
</head>
<body>
  <div id="status" role="status">주간 일정표를 불러오고 있어요.</div>
  <main id="stage" hidden><canvas id="board" width="1672" height="941" aria-label="주간 방송 일정표"></canvas><img id="avatar" alt="스트리머 갤러리 이미지" hidden></main>
  <script type="module" src="weekly-schedule-embed.js"></script>
</body>
</html>
